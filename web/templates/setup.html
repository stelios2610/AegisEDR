<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisEDR — Initial setup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0f14; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap { width: 100%; max-width: 420px; padding: 24px; }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 12px; font-weight: 900; }
  .logo-title { font-size: 26px; font-weight: 700; }
  .logo-sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
  .card { background: #141720; border: 1px solid #2a2f3e; border-radius: 16px; padding: 28px; }
  label { font-size: 12px; font-weight: 500; color: #94a3b8; display: block; margin-bottom: 6px; }
  input { background: #1c2030; border: 1px solid #2a2f3e; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; width: 100%; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #6366f1; }
  .btn { width: 100%; padding: 11px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .error { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .hint { color: #94a3b8; font-size: 12px; line-height: 1.5; margin-bottom: 16px; }
  code { color: #c4b5fd; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">A</div>
    <div class="logo-title">AEGIS<span style="color:#818cf8;">EDR</span></div>
    <div class="logo-sub">Create the console administrator</div>
  </div>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <p class="hint">The one-time setup token was written to <code>/opt/aegisedr/data/setup_token</code> when the console started. Root can read it. It is deleted after this form succeeds.</p>
    <form method="post" action="/setup">
      <label>Setup token</label>
      <input type="password" name="setup_token" autocomplete="off" required>
      <label>Administrator username</label>
      <input type="text" name="username" autocomplete="username" required>
      <label>Password (12 characters minimum)</label>
      <input type="password" name="password" autocomplete="new-password" required>
      <button type="submit" class="btn">Create administrator</button>
    </form>
  </div>
</div>
</body>
</html>
